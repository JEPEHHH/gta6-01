<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOL VERDE — open-world crime</title>
<!-- An inline icon: the page asks the network for nothing, not even a favicon. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1830'/%3E%3Ccircle cx='16' cy='14' r='7' fill='%23f2a03f'/%3E%3Crect x='6' y='22' width='20' height='4' rx='2' fill='%235e8b47'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0c11; }
  body { display: grid; place-items: center; }
  /* 16:9 letterbox: the game always renders its own 1280x720 frame, whatever the window. */
  #game { width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); display: block; background: #0a0c11; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"
  aria-label="Sol Verde: an open-world crime game. Walk or drive the city, take jobs from Riva, Mira and Tavo, shoot, and outrun the police."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
